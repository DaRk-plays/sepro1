<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <style>
    /* General Body Styles */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Dark Mode Styling */
    body.dark-mode {
      background-color: #1c1c1c;
      color: #eaeaea;
    }

    /* Profile Container */
    .profile-container {
      width: 100%;
      max-width: 500px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      padding: 20px;
      text-align: center;
      position: relative;
    }

    /* Profile Bar */
    .profile-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    /* Profile Picture */
    .profile-pic {
      position: relative;
    }

    .profile-pic img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #007bff;
    }

    .profile-pic input {
      position: absolute;
      bottom: 5px;
      right: 5px;
      width: 20px;
      height: 20px;
      opacity: 0;
      cursor: pointer;
    }

    /* Profile Details */
    .profile-details h2 {
      margin: 0;
      font-size: 22px;
    }

    .profile-details p {
      margin: 5px 0;
      font-size: 16px;
      color: #555;
    }

    .profile-details button {
      margin-top: 10px;
      padding: 8px 12px;
      font-size: 14px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .profile-details button:hover {
      background-color: #0056b3;
    }

    /* Theme Toggle */
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .theme-toggle p {
      font-size: 14px;
    }

    /* Switch (Light/Dark Toggle) */
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #007bff;
    }

    input:checked + .slider:before {
      transform: translateX(14px);
    }
  </style>
  <body>
    <div class="profile-container">
      <!-- Profile Section -->
      <div class="profile-bar">
        <div class="profile-pic">
          <img src="https://via.placeholder.com/100" alt="Profile Picture" />
          <input
            type="file"
            id="uploadPic"
            accept="image/*"
            onchange="updateProfilePic(this)"
          />
        </div>
        <div class="profile-details">
          <h2 id="username">John Doe</h2>
          <p>Resumes Uploaded: <span id="resumeCount">3</span></p>
          <p>Matches Reviewed: <span id="matchHistoryCount">12</span></p>
          <button id="logoutButton" onclick="logout()">Logout</button>
        </div>
      </div>

      <!-- Light/Dark Mode Toggle -->
      <div class="theme-toggle">
        <label class="switch">
          <input type="checkbox" id="themeSwitcher" onchange="toggleTheme()" />
          <span class="slider round"></span>
        </label>
        <p>Switch Mode</p>
      </div>
    </div>

    <script>
      // Function to toggle light/dark theme
      function toggleTheme() {
        document.body.classList.toggle("dark-mode");
      }

      // Function to update profile picture
      function updateProfilePic(input) {
        const file = input.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            document.querySelector(".profile-pic img").src = e.target.result;
          };
          reader.readAsDataURL(file);
        }
      }

      // Function to handle logout
      function logout() {
        alert("Logging out...");
        window.location.href = "/logout"; // Adjust this URL to match your Flask route
      }
    </script>
  </body>
</html>
